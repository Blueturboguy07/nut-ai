# The commands the publik Iris guide runs on a Windows PC before the phone
# build, on a clean runner, with no Visual Studio needed.
#
# Nov 1 2026: better-sqlite3 made `npm install` run node-gyp on every fresh
# install (npm's rebuild set ignores the package's own "gypfile": false when
# the entry comes from the lockfile), so a PC without the C++ build tools
# died at "Could not find any Visual Studio installation to use" and the
# corpus build and the phone build fell over after it. The driver is now
# node:sqlite, so an install that still prints "gyp" is a regression.
name: windows guide smoke

on:
  workflow_dispatch:
  push:
    branches: [main, 'fix/**']
    paths:
      - package.json
      - package-lock.json
      - tools/**
      - packages/db-adapter/**
      - scripts/check-node-sqlite.mjs
      - scripts/check-node-version.cjs
      - .github/iris-guide/**
      - .github/workflows/windows-guide-smoke.yml
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - tools/**
      - packages/db-adapter/**
      - scripts/check-node-sqlite.mjs
      - scripts/check-node-version.cjs
      - .github/iris-guide/**
      - .github/workflows/windows-guide-smoke.yml

jobs:
  # 22.16.0 is the floor (the first 22.x whose node:sqlite has FTS5), '22' is
  # the current LTS line, '24' the next one.
  install-and-build-corpus:
    name: install-and-build-corpus (Node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22.16.0', '22', '24', 'lts/*']
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Exactly the guide's step (dependencies.ps1: the Node check, then
      # npm.cmd install), as Iris runs it: Windows PowerShell 5.1, PATH from
      # the registry, so this job's Node goes into the machine Path first. The
      # output is kept so the next step can prove no native build ran: this
      # runner HAS Visual Studio, so a node-gyp rebuild would quietly succeed
      # here and only fail on a reader's PC.
      - name: npm install (the guide's "Install dependencies" step, as Iris runs it)
        run: |
          $nodeDir = Split-Path (Get-Command node).Source
          $machine = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          [Environment]::SetEnvironmentVariable('Path', "$nodeDir;$machine", 'Machine')
          node --version
          node .github/iris-guide/run-like-iris.mjs .github/iris-guide/dependencies.ps1 $env:GITHUB_WORKSPACE npm-install.log 1500
          if ($LASTEXITCODE -ne 0) { Write-Error "the guide's dependencies step failed (Iris $LASTEXITCODE)"; exit 1 }

      - name: no native build ran
        run: |
          if (Select-String -Path npm-install.log -Pattern 'gyp' -Quiet) {
            Write-Error 'npm install ran node-gyp; a PC without Visual Studio fails here'
            exit 1
          }
          if (Test-Path node_modules/better-sqlite3) {
            Write-Error 'better-sqlite3 is back in node_modules'
            exit 1
          }
          node scripts/check-node-sqlite.mjs

      - name: npm run data:build (the guide's "Build the nutrition database" step)
        run: npm run data:build 2>&1 | Tee-Object -FilePath data-build.log

      - name: the guide's visual check
        run: |
          if (-not (Select-String -Path data-build.log -Pattern '^Built ' -Quiet)) {
            Write-Error "data:build did not print 'Built .../nutrition.db'"
            exit 1
          }
          if (-not (Select-String -Path data-build.log -Pattern 'foods:\s+\d{4,}' -Quiet)) {
            Write-Error 'data:build did not print a foods count'
            exit 1
          }

      - name: npm run data:verify
        run: npm run data:verify

      - name: db-adapter and resolver tests on node:sqlite
        run: npx vitest run packages/db-adapter packages/resolver

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-guide-smoke-logs-${{ strategy.job-index }}
          path: |
            npm-install.log
            data-build.log

  # The guide's dependencies step (npm install, 767 packages, about 42,000
  # files), cold with an empty npm cache, as Iris runs it, in two places:
  #  - home-c: ~/nut-ai, where the guide puts it. On a runner C: is a remote
  #    disk ("Virtual_Disk NVME Premium"), about 6 times slower than D: for
  #    small files, and noisy: 342-670 s here (Nov 3 2026). This is the
  #    slowest place measured; it must end inside Iris's 900 s.
  #  - pc-like: the runner's local NVMe (D:) with Defender real-time scanning
  #    turned ON and the runner's exclusions removed, as on a home PC:
  #    215-238 s. It must end within 360 s (2.5 times under Iris's limit).
  # In the D: work folder with no scanning the same step takes 60-76 s. npm
  # cannot be split into two balanced steps: apps/mobile pulls about 93% of
  # the files.
  dependencies-step-time:
    name: dependencies-step-time (${{ matrix.place }}, Node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        place: ['home-c', 'pc-like']
        node: ['lts/*', '22']
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Defender real-time scanning on, no exclusions (pc-like only)
        if: matrix.place == 'pc-like'
        run: |
          Remove-MpPreference -ExclusionPath 'C:\', 'D:\'
          Set-MpPreference -DisableRealtimeMonitoring $false
          Start-Sleep -Seconds 5
          $status = Get-MpComputerStatus
          $exclusions = @((Get-MpPreference).ExclusionPath | Where-Object { $_ })
          Write-Output "real-time protection: $($status.RealTimeProtectionEnabled); exclusions: $($exclusions.Count)"
          if (-not $status.RealTimeProtectionEnabled -or $exclusions.Count -gt 0) { Write-Error 'Defender is not scanning like on a home PC'; exit 1 }

      - name: a copy of this commit where the step runs
        run: |
          $base = if ('${{ matrix.place }}' -eq 'pc-like') { 'D:\' } else { $HOME }
          $dir = Join-Path $base 'nut-ai'
          git clone --no-hardlinks --quiet $env:GITHUB_WORKSPACE $dir
          git -C $dir log --oneline -1
          "NUT_AI_DIR=$dir" >> $env:GITHUB_ENV
          "npm_config_cache=$(Join-Path $base 'npm-cache-cold')" >> $env:GITHUB_ENV

      - name: the guide's dependencies step, cold, as Iris runs it
        run: |
          $nodeDir = Split-Path (Get-Command node).Source
          $machine = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          [Environment]::SetEnvironmentVariable('Path', "$nodeDir;$machine", 'Machine')
          if (Test-Path $env:npm_config_cache) { Write-Error 'the npm cache folder already exists'; exit 1 }
          $limit = if ('${{ matrix.place }}' -eq 'pc-like') { 360 } else { 900 }
          $nodeVersion = node --version
          $npmVersion = npm --version
          node .github/iris-guide/run-like-iris.mjs .github/iris-guide/dependencies.ps1 $env:NUT_AI_DIR deps.log 900
          $code = $LASTEXITCODE
          $t = Get-Content deps.log.timing.json | ConvertFrom-Json
          Get-Content deps.log -Tail 6
          $line = "dependencies, ${{ matrix.place }} ($env:NUT_AI_DIR), Node $nodeVersion, npm ${npmVersion}: Iris $code, 'close' at $($t.endedAt) s (limit $limit s)"
          Write-Output $line
          "| $line |" >> $env:GITHUB_STEP_SUMMARY
          if ($code -ne 0) { Write-Error "the guide's dependencies step failed (Iris $code)"; exit 1 }
          if ([double]$t.endedAt -gt $limit) { Write-Error "the step closed at $($t.endedAt) s, over $limit s"; exit 1 }
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependencies-step-time-${{ strategy.job-index }}
          path: deps.log*

  # The guide's first check sees THAT Node answers, not which version. On
  # Node 20 the install used to pass with an engines warning and the corpus
  # build then died on "No such built-in module: node:sqlite"; on Node
  # 22.13-22.15 and 23.x it passed and the corpus build died on "no such
  # module: fts5" (blind verify, Nov 1 2026). The root preinstall
  # (scripts/check-node-version.cjs) must stop the install itself, and say why.
  unsupported-node-is-stopped:
    name: unsupported-node-is-stopped (Node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22.13.0', '22.15.0', '23.11.0']
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The guide's step runs the Node check before npm starts, so a bad Node
      # is named in seconds, before npm fetches anything (as the root
      # preinstall, the same check came about 75 s in, after the downloads).
      - name: the guide's dependencies step on Node ${{ matrix.node }} stops before npm starts
        run: |
          $nodeDir = Split-Path (Get-Command node).Source
          $machine = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          [Environment]::SetEnvironmentVariable('Path', "$nodeDir;$machine", 'Machine')
          node .github/iris-guide/run-like-iris.mjs .github/iris-guide/dependencies.ps1 $env:GITHUB_WORKSPACE deps-unsupported.log 300
          $code = $LASTEXITCODE
          $t = Get-Content deps-unsupported.log.timing.json | ConvertFrom-Json
          Get-Content deps-unsupported.log -Tail 8
          if ($code -eq 0) { Write-Error "the guide's dependencies step passed on Node ${{ matrix.node }}"; exit 1 }
          if (-not (Select-String -Path deps-unsupported.log -Pattern 'Nut AI needs Node 22.16.0 or newer, and not Node 23.' -SimpleMatch -Quiet)) {
            Write-Error "the step failed (Iris $code) without naming the Node floor"; exit 1
          }
          if (Test-Path node_modules) { Write-Error 'node_modules exists: npm started before the check stopped the step'; exit 1 }
          if ([double]$t.endedAt -gt 30) { Write-Error "the step ended at $($t.endedAt) s, not before npm"; exit 1 }
          Write-Output "stopped before npm: Iris $code at $($t.endedAt) s"
          "| dependencies on Node ${{ matrix.node }} | Iris $code | 'close' at $($t.endedAt) s | no node_modules |" >> $env:GITHUB_STEP_SUMMARY
          # GitHub's pwsh shell ends with `exit $LASTEXITCODE`: the stopped step's 1.
          exit 0

      # A plain `npm install` (not the guide's step) still stops: the same
      # check is the root preinstall.
      - name: npm install on Node ${{ matrix.node }} stops and names the Node floor
        run: |
          node --version
          npm install *> npm-install-unsupported.log
          $code = $LASTEXITCODE
          Get-Content npm-install-unsupported.log -Tail 15
          if ($code -eq 0) {
            Write-Error "npm install passed on Node ${{ matrix.node }}; the corpus build would die on node:sqlite or fts5 later"
            exit 1
          }
          if (-not (Select-String -Path npm-install-unsupported.log -Pattern 'Nut AI needs Node 22.16.0 or newer, and not Node 23.' -SimpleMatch -Quiet)) {
            Write-Error "npm install failed on Node ${{ matrix.node }} (exit $code) without naming the Node floor"
            exit 1
          }
          Write-Output "stopped as intended (exit $code)"
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unsupported-node-install-log-${{ matrix.node }}
          path: |
            deps-unsupported.log
            npm-install-unsupported.log

  # The guide's install-jdk step (Windows) on a PC whose java is Java 8: Java
  # 8 first on the machine PATH and JAVA_HOME pointing at it. Guide v16 first
  # only asked whether a java command existed, so it skipped the install and
  # Gradle then stopped with "Gradle requires JVM 17 or later to run" (blind
  # verify, run 41385115883). Every command runs through run-like-iris.mjs:
  # a fresh Windows PowerShell per step, PATH from the registry, done on the
  # pipe 'close', as in Iris.
  install-jdk-replaces-java-8:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: npm install and generate the Android project (the guide's earlier steps)
        run: |
          npm install --no-audit --no-fund 2>&1 | Select-Object -Last 5
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Set-Location apps/mobile
          npx expo prebuild --platform android 2>&1 | Select-Object -Last 5
          if (-not (Test-Path android/gradlew.bat)) { Write-Error 'no android/gradlew.bat'; exit 1 }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: make this runner a PC with Java 8 (machine PATH and JAVA_HOME)
        run: |
          $java8 = $env:JAVA_HOME
          & "$java8\bin\java.exe" -version
          $isJava = '(?i)\\java|jdk|jre|javapath|adoptium|zulu|corretto'
          foreach ($scope in 'Machine', 'User') {
            $entries = @(([Environment]::GetEnvironmentVariable('Path', $scope)) -split ';' | Where-Object { $_ })
            $removed = @($entries | Where-Object { $_ -match $isJava })
            $kept = @($entries | Where-Object { $_ -notmatch $isJava })
            Write-Output "$scope Path: removed $($removed.Count) Java entries: $($removed -join ' | ')"
            if ($scope -eq 'Machine') { $kept = @("$java8\bin") + $kept }
            [Environment]::SetEnvironmentVariable('Path', ($kept -join ';'), $scope)
          }
          [Environment]::SetEnvironmentVariable('JAVA_HOME', $java8, 'Machine')
          [Environment]::SetEnvironmentVariable('JAVA_HOME', $null, 'User')
          Get-ChildItem "$env:ProgramFiles\Eclipse Adoptium" -ErrorAction SilentlyContinue | ForEach-Object { "already under Program Files: $($_.FullName)" }
          Write-Output "JAVA_HOME for the next steps (what Iris would inherit): $java8"
          # An empty build: `help` there starts Gradle (this project's wrapper,
          # Gradle 9.3.1) in seconds and needs no Android SDK or Node.
          $empty = Join-Path $env:RUNNER_TEMP 'empty-build'
          New-Item -ItemType Directory -Force $empty | Out-Null
          Set-Content (Join-Path $empty 'settings.gradle') "rootProject.name = 'jvm-probe'"

      # Gradle 9 checks its JVM when it starts a build, not for --version.
      - name: control - Gradle on this PC before the guide step refuses Java 8
        working-directory: apps/mobile/android
        run: |
          $empty = Join-Path $env:RUNNER_TEMP 'empty-build'
          $probe = Join-Path $env:RUNNER_TEMP 'control.ps1'
          Set-Content $probe "java -version`n.\gradlew.bat --version`n.\gradlew.bat -p '$empty' help --console=plain"
          node ../../../.github/iris-guide/run-like-iris.mjs $probe (Get-Location).Path "$env:RUNNER_TEMP\control.log" 600
          $code = $LASTEXITCODE
          if ($code -eq 0) { Write-Error 'Gradle built on Java 8; this runner does not reproduce the reader PC'; exit 1 }
          if (-not (Select-String -Path "$env:RUNNER_TEMP\control.log" -Pattern 'Gradle requires JVM 17 or later to run' -SimpleMatch -Quiet)) {
            Write-Error "Gradle failed on Java 8 (exit $code) without the JVM 17 message"
            exit 1
          }
          Write-Output "reproduced: Gradle refuses Java 8 (Iris exit $code)"
          exit 0

      - name: the guide's install-jdk command (verbatim), as Iris runs it
        run: |
          node .github/iris-guide/run-like-iris.mjs .github/iris-guide/install-jdk.ps1 $HOME install-jdk.log 900
          $code = $LASTEXITCODE
          if ($code -ne 0) { Write-Error "install-jdk failed (Iris exit $code)"; exit 1 }
          $last = Select-String -Path install-jdk.log -Pattern 'version "(1\.)?(\d+)' | Select-Object -Last 1
          if (-not $last) { Write-Error 'install-jdk printed no java version'; exit 1 }
          # "1.8.0_504" -> 8, "17.0.20" -> 17: group 2 is the major either way.
          $major = [int]$last.Matches[0].Groups[2].Value
          Write-Output "last java -version line: $($last.Line.Trim()) -> major $major"
          if ($major -lt 17) { Write-Error "install-jdk ended on Java $major"; exit 1 }
          $saved = [Environment]::GetEnvironmentVariable('JAVA_HOME', 'User')
          Write-Output "User JAVA_HOME saved by the step: $saved"
          if (-not $saved -or -not (Test-Path "$saved\bin\java.exe")) { Write-Error 'no usable User JAVA_HOME saved'; exit 1 }

      # The build steps' prelude (prepare-gradle.ps1 verbatim, the same in all
      # seven build steps), then the same Gradle probe as the control instead
      # of the release build. --no-daemon: a daemon outlives the step (see the
      # next step).
      - name: the guide's build-step prelude, as Iris runs it - Gradle builds on 17
        working-directory: apps/mobile/android
        run: |
          $guide = Get-Content ../../../.github/iris-guide/prepare-gradle.ps1 -Raw
          $build = '.\gradlew.bat help'
          if (-not $guide.TrimEnd().EndsWith("`n$build")) { Write-Error 'prepare-gradle.ps1 no longer ends with the Gradle help line'; exit 1 }
          $empty = Join-Path $env:RUNNER_TEMP 'empty-build'
          $probe = Join-Path $env:RUNNER_TEMP 'after.ps1'
          Set-Content $probe $guide.Replace($build, "java -version`n.\gradlew.bat --version`n.\gradlew.bat -p '$empty' help --no-daemon --console=plain")
          node ../../../.github/iris-guide/run-like-iris.mjs $probe (Get-Location).Path "$env:RUNNER_TEMP\gradle.log" 600
          $code = $LASTEXITCODE
          if ($code -ne 0) { Write-Error "Gradle failed after install-jdk (Iris exit $code)"; exit 1 }
          $jvm = Select-String -Path "$env:RUNNER_TEMP\gradle.log" -Pattern 'JVM:\s+(\d+)' | Select-Object -First 1
          if (-not $jvm) { Write-Error 'gradlew --version printed no JVM line'; exit 1 }
          Write-Output "Gradle: $($jvm.Line.Trim())"
          if ([int]$jvm.Matches[0].Groups[1].Value -lt 17) { Write-Error 'Gradle still runs on a JVM older than 17'; exit 1 }
          if (Select-String -Path "$env:RUNNER_TEMP\gradle.log" -Pattern 'Gradle requires JVM 17' -SimpleMatch -Quiet) { Write-Error 'Gradle still refuses the JVM'; exit 1 }
          if (-not (Select-String -Path "$env:RUNNER_TEMP\gradle.log" -Pattern 'BUILD SUCCESSFUL' -SimpleMatch -Quiet)) { Write-Error 'the Gradle build did not succeed'; exit 1 }
          Write-Output 'Gradle builds on Java 17 after the guide step'

      # Iris waits for the pipe 'close', and a Gradle daemon that starts inside
      # the step keeps the pipe open after the build is done (round 3 measured
      # it here: BUILD SUCCESSFUL in 6 s, no 'close' in 180 s, Iris would
      # record 124). The guide's build steps now turn the daemon off, so the
      # same build with their prelude must end on its own.
      - name: the guide's build-step prelude leaves no daemon - Iris gets the 'close'
        working-directory: apps/mobile/android
        timeout-minutes: 10
        run: |
          $guide = Get-Content ../../../.github/iris-guide/prepare-gradle.ps1 -Raw
          $empty = Join-Path $env:RUNNER_TEMP 'empty-build'
          $probe = Join-Path $env:RUNNER_TEMP 'daemon.ps1'
          Set-Content $probe $guide.Replace('.\gradlew.bat help', ".\gradlew.bat -p '$empty' help --console=plain")
          node ../../../.github/iris-guide/run-like-iris.mjs $probe (Get-Location).Path "$env:RUNNER_TEMP\daemon.log" 180
          $code = $LASTEXITCODE
          $built = Select-String -Path "$env:RUNNER_TEMP\daemon.log" -Pattern 'BUILD SUCCESSFUL' -SimpleMatch -Quiet
          & ../../../.github/iris-guide/build-processes.ps1 -Label 'after the prelude build' -FailOnDaemon -Stop
          $left = $LASTEXITCODE
          Write-Output "with the guide's prelude: build finished = $built, Iris exit $code (124 = Iris would time out)"
          if (-not $built) { Write-Error 'the Gradle build did not succeed'; exit 1 }
          if ($code -ne 0) { Write-Error "Iris would record $code"; exit 1 }
          if ($left -ne 0) { Write-Error 'a daemon outlived the step'; exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-jdk-java-8-logs
          path: |
            install-jdk.log
            ${{ runner.temp }}/control.log
            ${{ runner.temp }}/gradle.log
            ${{ runner.temp }}/daemon.log

  # The same command on a PC that already has Java 17 on PATH: nothing is
  # installed and no JAVA_HOME is saved.
  install-jdk-keeps-java-17:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: the guide's install-jdk command (verbatim), as Iris runs it
        run: |
          [Environment]::SetEnvironmentVariable('JAVA_HOME', $null, 'User')
          node .github/iris-guide/run-like-iris.mjs .github/iris-guide/install-jdk.ps1 $HOME install-jdk.log 900
          if ($LASTEXITCODE -ne 0) { Write-Error "install-jdk failed (Iris exit $LASTEXITCODE)"; exit 1 }
          if (-not (Select-String -Path install-jdk.log -Pattern 'version "17\.' -Quiet)) { Write-Error 'no Java 17 version line'; exit 1 }
          if (Select-String -Path install-jdk.log -Pattern 'Found Eclipse Temurin|Successfully installed' -Quiet) { Write-Error 'winget ran on a PC that already had Java 17'; exit 1 }
          $saved = [Environment]::GetEnvironmentVariable('JAVA_HOME', 'User')
          if ($saved) { Write-Error "a User JAVA_HOME was saved ($saved) although Java 17 was already there"; exit 1 }
          Write-Output 'Java 17 left alone: no winget, no saved JAVA_HOME'

  # Round 5 (Nov 2 2026). Iris for Windows gives every step the same 15
  # minutes (iris-windows shell.ts DEFAULT_COMMAND_TIMEOUT_MS) and ends a step
  # on the pipe 'close'. The cold release build was one step of 16m20s for
  # ONE ABI (run 41417884164), and the guide's command really built all four
  # ABIs (expo passes Gradle no ABI for a release build). The guide now builds
  # for the phone's ABI only. Round 5 ran the build as four steps; on the
  # slowest runners build-libraries still took 481-483 s, so round 6 runs it
  # as seven: prepare-gradle, build-native-1, build-native-2,
  # build-native-app, build-libraries, prepare-app and run-android. This job
  # runs the seven guide commands cold, one after another, through
  # run-like-iris.mjs (a copy of Iris's step runner), then all seven again
  # (each step must be safe to run again). Every step must end (pipe
  # 'close', Iris exit 0) within the verdict's limit. No phone here:
  # run-android's last line is replaced by expo-build-no-phone.mjs (expo's
  # own eager JS export and Gradle run, without the device lookup and the
  # install), and the ABI query gets no answer, so the arm64-v8a fallback is
  # what builds. Manual only: a cold release build is long.
  #
  # Three runners at once: runner speed varies by up to 1.7x between runs, and
  # each step must stay under about 360 s on the slowest one.
  run-android-split-steps:
    name: run-android-split-steps (runner ${{ matrix.runner }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 170
    # The build runs where the guide puts it, ~/nut-ai on C: (the runner's
    # OS disk, slower for small files than the D: work folder), not in the
    # checkout.
    env:
      NUT_AI: C:\Users\runneradmin\nut-ai
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: a copy of this commit in ~/nut-ai, where the guide's clone step puts it
        run: |
          if ($env:NUT_AI -ne (Join-Path $HOME 'nut-ai')) { Write-Error "HOME is $HOME, not C:\Users\runneradmin"; exit 1 }
          git clone --no-hardlinks --quiet $env:GITHUB_WORKSPACE $env:NUT_AI
          git -C $env:NUT_AI log --oneline -1

      - name: npm install and generate the Android project (the guide's earlier steps)
        working-directory: ${{ env.NUT_AI }}
        run: |
          npm install --no-audit --no-fund 2>&1 | Select-Object -Last 5
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Set-Location apps/mobile
          npx expo prebuild --platform android 2>&1 | Select-Object -Last 5
          if (-not (Test-Path android/gradlew.bat)) { Write-Error 'no android/gradlew.bat'; exit 1 }
          Get-Content android/gradle.properties | Where-Object { $_ -match '^(org\.gradle|kotlin)\.|^reactNativeArchitectures' }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Iris builds PATH from the registry, so the Node a reader installed is
      # the one in the machine Path: put this job's Node 22 there. A reader's
      # Android Studio puts the SDK in %LOCALAPPDATA%\Android\Sdk and sets no
      # ANDROID_HOME: a junction gives the runner's SDK that path, and the
      # reader-like phases run with ANDROID_HOME and ANDROID_SDK_ROOT removed
      # (run-build-step.ps1).
      - name: make this runner a PC with Node 22, Java 17 and the SDK where Android Studio puts it
        run: |
          $nodeDir = Split-Path (Get-Command node).Source
          $machine = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          [Environment]::SetEnvironmentVariable('Path', "$nodeDir;$machine", 'Machine')
          [Environment]::SetEnvironmentVariable('JAVA_HOME', $null, 'User')
          $sdkDefault = Join-Path $HOME 'AppData\Local\Android\Sdk'
          if (-not (Test-Path $sdkDefault)) {
            New-Item -ItemType Directory -Force (Split-Path $sdkDefault) | Out-Null
            New-Item -ItemType Junction -Path $sdkDefault -Target $env:ANDROID_HOME | Out-Null
          }
          if (-not (Test-Path (Join-Path $sdkDefault 'platform-tools\adb.exe'))) { Write-Error "no adb under $sdkDefault"; exit 1 }
          Write-Output "node: $nodeDir ($(node --version)); JAVA_HOME: $env:JAVA_HOME; SDK: $env:ANDROID_HOME, also at $sdkDefault"
          Get-ChildItem (Join-Path $env:ANDROID_HOME 'ndk') -ErrorAction SilentlyContinue | ForEach-Object { "NDK on the runner: $($_.Name)" }
          New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'r5') | Out-Null
          "| step | run | deadline (s) | Iris records | BUILD line at (s) | 'close' at (s) | what it said |" >> $env:GITHUB_STEP_SUMMARY
          "|---|---|---|---|---|---|---|" >> $env:GITHUB_STEP_SUMMARY

      - name: check the 7 build steps share one prelude, and write the CI command files
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'r5'
          $ends = [ordered]@{
            'prepare-gradle'   = '.\gradlew.bat help'
            'build-native-1'   = '.\gradlew.bat :react-native-worklets:externalNativeBuildRelease :react-native-nitro-modules:externalNativeBuildRelease :react-native-screens:externalNativeBuildRelease :expo-modules-core:externalNativeBuildRelease'
            'build-native-2'   = '.\gradlew.bat externalNativeBuildRelease -x :app:externalNativeBuildRelease'
            'build-native-app' = '.\gradlew.bat :app:externalNativeBuildRelease'
            'build-libraries'  = '.\gradlew.bat assembleRelease -x :app:assembleRelease'
            'prepare-app'      = '.\gradlew.bat lintVitalAnalyzeRelease :app:mergeExtDexRelease -x :app:lintVitalAnalyzeRelease'
            'run-android'      = 'npx.cmd expo run:android --variant release --no-bundler'
          }
          $prelude = $null
          foreach ($id in $ends.Keys) {
            $lines = @((Get-Content ".github/iris-guide/$id.ps1" -Raw) -split '\r?\n' | Where-Object { $_ -ne '' })
            if ($lines[-1] -ne $ends[$id]) { Write-Error "$id.ps1 no longer ends with: $($ends[$id])"; exit 1 }
            $head = @($lines[0..($lines.Count - 2)]) -join "`n"
            if ($null -eq $prelude) { $prelude = $head } elseif ($head -ne $prelude) { Write-Error "$id.ps1 has a different prelude"; exit 1 }
          }
          foreach ($must in @("`$env:GRADLE_OPTS = '-Dorg.gradle.daemon=false'", '$adb.UseShellExecute = $true', '$env:ORG_GRADLE_PROJECT_reactNativeArchitectures = $abi')) {
            if (-not $prelude.Contains($must)) { Write-Error "the prelude lacks: $must"; exit 1 }
          }
          $standIn = 'node "' + (Join-Path $env:GITHUB_WORKSPACE '.github\iris-guide\expo-build-no-phone.mjs') + '"'
          Set-Content "$dir\run-android-no-phone.ps1" ($prelude + "`n" + $standIn)
          Set-Content "$dir\abi-probe.ps1" ($prelude + "`n" + 'Write-Output ("ABI=" + $env:ORG_GRADLE_PROJECT_reactNativeArchitectures)')
          Write-Output "== the prelude the 7 steps share ($(@($prelude -split "`n").Count) lines)"
          $prelude
          Write-Output "== run-android in CI ends with: $standIn"

      # The prelude's ABI pick on Windows PowerShell 5.1 (what Iris runs),
      # against a fake adb.exe that answers like a phone. The cold run below
      # has no phone, so it covers only the fallback.
      - name: ABI pick - the prelude against a fake adb.exe, as Iris runs it
        shell: powershell
        run: |
          $fake = Join-Path $env:RUNNER_TEMP 'fake-sdk'
          New-Item -ItemType Directory -Force "$fake\platform-tools" | Out-Null
          $src = @'
          using System;
          public static class FakeAdb {
            public static int Main(string[] args) {
              if (args.Length > 0 && args[0] == "start-server") return 0;
              string list = Environment.GetEnvironmentVariable("FAKE_ABILIST");
              if (String.IsNullOrEmpty(list)) { Console.Error.WriteLine("adb.exe: no devices/emulators found"); return 1; }
              Console.Write(list + "\r\n");
              return 0;
            }
          }
          '@
          Add-Type -TypeDefinition $src -OutputAssembly "$fake\platform-tools\adb.exe" -OutputType ConsoleApplication
          $env:ANDROID_HOME = $fake
          Remove-Item Env:ANDROID_SDK_ROOT -ErrorAction SilentlyContinue
          $cases = @(
            @('arm64-v8a,armeabi-v7a,armeabi', 'arm64-v8a'),
            @('armeabi-v7a,armeabi', 'armeabi-v7a'),
            @('x86_64,x86,arm64-v8a', 'x86_64'),
            @('', 'arm64-v8a')
          )
          $bad = 0
          foreach ($case in $cases) {
            $env:FAKE_ABILIST = $case[0]
            $log = Join-Path $env:RUNNER_TEMP 'r5\abi-probe.log'
            node .github/iris-guide/run-like-iris.mjs "$env:RUNNER_TEMP\r5\abi-probe.ps1" $env:GITHUB_WORKSPACE $log 60
            $code = $LASTEXITCODE
            $line = Select-String -Path $log -Pattern '^ABI=' | Select-Object -First 1
            $got = if ($line) { $line.Line.Substring(4).Trim() } else { '(none)' }
            # The probe ends on Write-Output, so with no answer the failed adb
            # query is the last native exit code (Iris 1). In the guide steps
            # Gradle or npx runs last and sets the step's code.
            $ok = ($code -ne 124) -and ($got -eq $case[1])
            if (-not $ok) { $bad += 1 }
            Write-Output "phone says '$($case[0])' -> ABI $got (want $($case[1])), Iris exit $code"
            "| ABI pick: phone says '$($case[0])' | fake adb | 60 | $code | - | - | ABI $got (want $($case[1])) |" >> $env:GITHUB_STEP_SUMMARY
          }
          if ($bad -gt 0) { Write-Error "$bad ABI case(s) wrong"; exit 1 }
          exit 0

      # The guide's exact run-android with no phone, as on a reader's PC (no
      # ANDROID_HOME): it must end at once with expo's no-device message,
      # while the adb server the prelude started keeps running.
      - name: no phone - the guide's exact run-android command ends with the no-device message
        working-directory: ${{ env.NUT_AI }}\apps\mobile
        timeout-minutes: 10
        run: |
          & ../../.github/iris-guide/run-build-step.ps1 -Step 'run-android-exact' -Run 'no-phone' -CommandFile ../../.github/iris-guide/run-android.ps1 -WorkDir (Get-Location).Path -Deadline 300 -Linger 60
          $code = $LASTEXITCODE
          $adbAlive = @(Get-Process adb -ErrorAction SilentlyContinue).Count
          $said = Select-String -Path "$env:RUNNER_TEMP\r5\run-android-exact-no-phone.log" -Pattern 'No Android connected device found' -SimpleMatch -Quiet
          Write-Output "adb processes still running after the step: $adbAlive"
          if ($code -eq 124) { Write-Error 'the guide command with no phone never ended: a child holds the pipe'; exit 1 }
          if ($code -eq 0) { Write-Error 'expo run:android passed with no phone'; exit 1 }
          if (-not $said) { Write-Error "expo stopped (exit $code) without the no-device message"; exit 1 }
          if ($adbAlive -lt 1) { Write-Error 'no adb server left: the prelude did not start it'; exit 1 }
          exit 0

      # Cold: the 7 steps in the guide's order on a PC that never built
      # this app. The deadline is longer than Iris's 900 s only so that a slow
      # step still reports its real time; the verdict below holds each step
      # to $limit.
      - name: cold 1/7 - prepare-gradle
        working-directory: ${{ env.NUT_AI }}\apps\mobile\android
        timeout-minutes: 40
        run: |
          & ../../../.github/iris-guide/run-build-step.ps1 -Step 'prepare-gradle' -Run 'cold' -CommandFile ../../../.github/iris-guide/prepare-gradle.ps1 -WorkDir (Get-Location).Path -Deadline 1800

      - name: cold 2/7 - build-native-1
        working-directory: ${{ env.NUT_AI }}\apps\mobile\android
        timeout-minutes: 40
        run: |
          & ../../../.github/iris-guide/run-build-step.ps1 -Step 'build-native-1' -Run 'cold' -CommandFile ../../../.github/iris-guide/build-native-1.ps1 -WorkDir (Get-Location).Path -Deadline 1800

      - name: cold 3/7 - build-native-2
        working-directory: ${{ env.NUT_AI }}\apps\mobile\android
        timeout-minutes: 40
        run: |
          & ../../../.github/iris-guide/run-build-step.ps1 -Step 'build-native-2' -Run 'cold' -CommandFile ../../../.github/iris-guide/build-native-2.ps1 -WorkDir (Get-Location).Path -Deadline 1800

      - name: cold 4/7 - build-native-app
        working-directory: ${{ env.NUT_AI }}\apps\mobile\android
        timeout-minutes: 40
        run: |
          & ../../../.github/iris-guide/run-build-step.ps1 -Step 'build-native-app' -Run 'cold' -CommandFile ../../../.github/iris-guide/build-native-app.ps1 -WorkDir (Get-Location).Path -Deadline 1800

      - name: cold 5/7 - build-libraries
        working-directory: ${{ env.NUT_AI }}\apps\mobile\android
        timeout-minutes: 40
        run: |
          & ../../../.github/iris-guide/run-build-step.ps1 -Step 'build-libraries' -Run 'cold' -CommandFile ../../../.github/iris-guide/build-libraries.ps1 -WorkDir (Get-Location).Path -Deadline 1800

      - name: cold 6/7 - prepare-app
        working-directory: ${{ env.NUT_AI }}\apps\mobile\android
        timeout-minutes: 40
        run: |
          & ../../../.github/iris-guide/run-build-step.ps1 -Step 'prepare-app' -Run 'cold' -CommandFile ../../../.github/iris-guide/prepare-app.ps1 -WorkDir (Get-Location).Path -Deadline 1800

      - name: cold 7/7 - run-android (expo's eager export and Gradle run, no phone)
        working-directory: ${{ env.NUT_AI }}\apps\mobile
        timeout-minutes: 40
        run: |
          & ../../.github/iris-guide/run-build-step.ps1 -Step 'run-android' -Run 'cold' -CommandFile "$env:RUNNER_TEMP\r5\run-android-no-phone.ps1" -WorkDir (Get-Location).Path -Deadline 1800 -NoCi

      # Again: each step must be safe to run again and end on its own.
      - name: again 1/7 - prepare-gradle
        working-directory: ${{ env.NUT_AI }}\apps\mobile\android
        timeout-minutes: 20
        run: |
          & ../../../.github/iris-guide/run-build-step.ps1 -Step 'prepare-gradle' -Run 'again' -CommandFile ../../../.github/iris-guide/prepare-gradle.ps1 -WorkDir (Get-Location).Path

      - name: again 2/7 - build-native-1
        working-directory: ${{ env.NUT_AI }}\apps\mobile\android
        timeout-minutes: 20
        run: |
          & ../../../.github/iris-guide/run-build-step.ps1 -Step 'build-native-1' -Run 'again' -CommandFile ../../../.github/iris-guide/build-native-1.ps1 -WorkDir (Get-Location).Path

      - name: again 3/7 - build-native-2
        working-directory: ${{ env.NUT_AI }}\apps\mobile\android
        timeout-minutes: 20
        run: |
          & ../../../.github/iris-guide/run-build-step.ps1 -Step 'build-native-2' -Run 'again' -CommandFile ../../../.github/iris-guide/build-native-2.ps1 -WorkDir (Get-Location).Path

      - name: again 4/7 - build-native-app
        working-directory: ${{ env.NUT_AI }}\apps\mobile\android
        timeout-minutes: 20
        run: |
          & ../../../.github/iris-guide/run-build-step.ps1 -Step 'build-native-app' -Run 'again' -CommandFile ../../../.github/iris-guide/build-native-app.ps1 -WorkDir (Get-Location).Path

      - name: again 5/7 - build-libraries
        working-directory: ${{ env.NUT_AI }}\apps\mobile\android
        timeout-minutes: 20
        run: |
          & ../../../.github/iris-guide/run-build-step.ps1 -Step 'build-libraries' -Run 'again' -CommandFile ../../../.github/iris-guide/build-libraries.ps1 -WorkDir (Get-Location).Path

      - name: again 6/7 - prepare-app
        working-directory: ${{ env.NUT_AI }}\apps\mobile\android
        timeout-minutes: 20
        run: |
          & ../../../.github/iris-guide/run-build-step.ps1 -Step 'prepare-app' -Run 'again' -CommandFile ../../../.github/iris-guide/prepare-app.ps1 -WorkDir (Get-Location).Path

      - name: again 7/7 - run-android (expo's eager export and Gradle run, no phone)
        working-directory: ${{ env.NUT_AI }}\apps\mobile
        timeout-minutes: 20
        run: |
          & ../../.github/iris-guide/run-build-step.ps1 -Step 'run-android' -Run 'again' -CommandFile "$env:RUNNER_TEMP\r5\run-android-no-phone.ps1" -WorkDir (Get-Location).Path -NoCi

      - name: the APK and the ABIs inside it
        if: always()
        working-directory: ${{ env.NUT_AI }}\apps\mobile\android
        run: |
          $apk = Get-ChildItem app/build/outputs/apk/release -Filter *.apk -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $apk) { Write-Output 'no release APK'; exit 0 }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($apk.FullName)
          $abis = @($zip.Entries | Where-Object { $_.FullName -match '^lib/([^/]+)/' } | ForEach-Object { $Matches[1] } | Sort-Object -Unique)
          $zip.Dispose()
          $text = "$($apk.Name): $([math]::Round($apk.Length / 1MB, 1)) MB, native code for: $($abis -join ', ')"
          Write-Output $text
          "APK: $text" >> $env:GITHUB_STEP_SUMMARY
          Set-Content (Join-Path $env:RUNNER_TEMP 'r5\apk-abis.txt') ($abis -join ',')

      - name: verdict - each step closed within the limit, built one ABI, and did not redo an earlier step
        if: always()
        run: |
          & .github/iris-guide/build-processes.ps1 -Label 'at the end' -Stop
          $file = Join-Path $env:RUNNER_TEMP 'r5\results.jsonl'
          if (-not (Test-Path $file)) { Write-Error 'no results'; exit 1 }
          $rows = @(Get-Content $file | ForEach-Object { $_ | ConvertFrom-Json })
          $steps = 'prepare-gradle', 'build-native-1', 'build-native-2', 'build-native-app', 'build-libraries', 'prepare-app', 'run-android'
          # About 360 s is the target on the slowest runner (2.5x under Iris's
          # 900 s); the gate is 400 s so that one slow runner does not hide
          # the numbers of the others. The summary gives every step's time.
          $limit = 400
          $fail = @()
          foreach ($run in 'cold', 'again') {
            foreach ($id in $steps) {
              $r = $rows | Where-Object { $_.step -eq $id -and $_.run -eq $run } | Select-Object -Last 1
              if (-not $r) { $fail += "$id ($run) did not run"; continue }
              if ($r.recorded -ne 0) { $fail += "$id ($run): Iris would record $($r.recorded)" }
              if ($r.closeAt -gt $limit) { $fail += "$id ($run): 'close' at $($r.closeAt) s, over $limit s" }
              if ($r.said -notmatch 'BUILD SUCCESSFUL') { $fail += "$id ($run): no BUILD SUCCESSFUL" }
              if ($r.daemonLeft) { $fail += "$id ($run): a Gradle daemon outlived the step" }
              if ($r.abis -and $r.abis -ne 'arm64-v8a') { $fail += "$id ($run): CMake ABIs $($r.abis)" }
            }
          }
          $cold = @{}
          foreach ($r in ($rows | Where-Object { $_.run -eq 'cold' })) { $cold[$r.step] = $r }
          # Where the work happened: C/C++ files compiled (libraries, app) and
          # library Kotlin compiles run, per cold step. Each part of the build
          # is done once, in its own step; a run again redoes nothing. 'none'
          # allows 2 files (run-build-step.ps1 lists them in the log), 'some'
          # is at least 1; a real native build here compiles hundreds.
          $expect = @{
            'prepare-gradle'   = @{ ninjaLib = 'none'; ninjaApp = 'none'; libKotlinRan = 'none' }
            'build-native-1'   = @{ ninjaLib = 'some'; ninjaApp = 'none'; libKotlinRan = 'none' }
            'build-native-2'   = @{ ninjaLib = 'some'; ninjaApp = 'none'; libKotlinRan = 'none' }
            'build-native-app' = @{ ninjaLib = 'none'; ninjaApp = 'some'; libKotlinRan = 'none' }
            'build-libraries'  = @{ ninjaLib = 'none'; ninjaApp = 'none'; libKotlinRan = 'some' }
            'prepare-app'      = @{ ninjaLib = 'none'; ninjaApp = 'none'; libKotlinRan = 'none' }
            'run-android'      = @{ ninjaLib = 'none'; ninjaApp = 'none'; libKotlinRan = 'none' }
          }
          foreach ($id in $steps) {
            if (-not $cold[$id]) { continue }
            foreach ($field in 'ninjaLib', 'ninjaApp', 'libKotlinRan') {
              $n = [int]$cold[$id].$field
              $want = $expect[$id][$field]
              if (($want -eq 'none' -and $n -gt 2) -or ($want -eq 'some' -and $n -lt 1)) { $fail += "$id (cold): $field = $n, expected $want" }
            }
          }
          foreach ($r in ($rows | Where-Object { $_.run -eq 'again' })) {
            if (([int]$r.ninjaLib + [int]$r.ninjaApp) -gt 2 -or [int]$r.libKotlinRan -gt 0) { $fail += "$($r.step) (again) redid work: C/C++ $($r.ninjaLib)+$($r.ninjaApp), library Kotlin $($r.libKotlinRan)" }
          }
          $apkAbis = Get-Content (Join-Path $env:RUNNER_TEMP 'r5\apk-abis.txt') -ErrorAction SilentlyContinue
          if ($apkAbis -ne 'arm64-v8a') { $fail += "the APK holds native code for: $apkAbis" }
          $total = 0
          foreach ($id in $steps) { if ($cold[$id]) { $total += $cold[$id].closeAt } }
          $line = "cold total: $([math]::Round($total, 1)) s over 7 steps; longest step: $(($cold.Values | Sort-Object closeAt | Select-Object -Last 1).step) at $(($cold.Values | Sort-Object closeAt | Select-Object -Last 1).closeAt) s"
          Write-Output $line
          $line >> $env:GITHUB_STEP_SUMMARY
          if ($fail.Count -gt 0) { $fail | ForEach-Object { Write-Output "FAIL: $_" }; Write-Error "$($fail.Count) check(s) failed"; exit 1 }
          Write-Output "every step closed within $limit s with Iris exit 0, built arm64-v8a only, did its own part of the build once, and redid nothing when run again"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-android-split-steps-logs-${{ matrix.runner }}
          path: ${{ runner.temp }}/r5/

  # Round 5, the comparison: the guide's run-android as it was before this
  # round (one step for the whole build, all four ABIs; nut-ai 139cd78, guide
  # round 4), cold, on its own fresh runner, through the same runner copy and
  # the same expo stand-in. The deadline is long so that the full time is
  # known; Iris would stop the step at 900 s.
  run-android-old-one-step:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: npm install and generate the Android project (the guide's earlier steps)
        run: |
          npm install --no-audit --no-fund 2>&1 | Select-Object -Last 5
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Set-Location apps/mobile
          npx expo prebuild --platform android 2>&1 | Select-Object -Last 5
          if (-not (Test-Path android/gradlew.bat)) { Write-Error 'no android/gradlew.bat'; exit 1 }
          Get-Content android/gradle.properties | Where-Object { $_ -match '^(org\.gradle|kotlin)\.|^reactNativeArchitectures' }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Iris builds PATH from the registry, so the Node a reader installed is
      # the one in the machine Path: put this job's Node 22 there. A reader's
      # Android Studio puts the SDK in %LOCALAPPDATA%\Android\Sdk and sets no
      # ANDROID_HOME: a junction gives the runner's SDK that path, and the
      # reader-like phases run with ANDROID_HOME and ANDROID_SDK_ROOT removed
      # (run-build-step.ps1).
      - name: make this runner a PC with Node 22, Java 17 and the SDK where Android Studio puts it
        run: |
          $nodeDir = Split-Path (Get-Command node).Source
          $machine = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          [Environment]::SetEnvironmentVariable('Path', "$nodeDir;$machine", 'Machine')
          [Environment]::SetEnvironmentVariable('JAVA_HOME', $null, 'User')
          $sdkDefault = Join-Path $HOME 'AppData\Local\Android\Sdk'
          if (-not (Test-Path $sdkDefault)) {
            New-Item -ItemType Directory -Force (Split-Path $sdkDefault) | Out-Null
            New-Item -ItemType Junction -Path $sdkDefault -Target $env:ANDROID_HOME | Out-Null
          }
          if (-not (Test-Path (Join-Path $sdkDefault 'platform-tools\adb.exe'))) { Write-Error "no adb under $sdkDefault"; exit 1 }
          Write-Output "node: $nodeDir ($(node --version)); JAVA_HOME: $env:JAVA_HOME; SDK: $env:ANDROID_HOME, also at $sdkDefault"
          Get-ChildItem (Join-Path $env:ANDROID_HOME 'ndk') -ErrorAction SilentlyContinue | ForEach-Object { "NDK on the runner: $($_.Name)" }
          New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'r5') | Out-Null
          "| step | run | deadline (s) | Iris records | BUILD line at (s) | 'close' at (s) | what it said |" >> $env:GITHUB_STEP_SUMMARY
          "|---|---|---|---|---|---|---|" >> $env:GITHUB_STEP_SUMMARY

      - name: write the round 4 run-android command (nut-ai 139cd78)
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'r5'
          $old = (git show 139cd78:.github/iris-guide/run-android.ps1) -join "`n"
          $lines = @($old -split '\r?\n' | Where-Object { $_ -ne '' })
          if ($lines[-1] -ne 'npx.cmd expo run:android --variant release') { Write-Error 'unexpected round 4 command'; exit 1 }
          if ($old -match 'reactNativeArchitectures') { Write-Error 'the round 4 command already names an ABI'; exit 1 }
          $standIn = 'node "' + (Join-Path $env:GITHUB_WORKSPACE '.github\iris-guide\expo-build-no-phone.mjs') + '"'
          Set-Content "$dir\old-run-android-no-phone.ps1" ((@($lines[0..($lines.Count - 2)]) + $standIn) -join "`n")
          Get-Content "$dir\old-run-android-no-phone.ps1"

      - name: old - round 4 run-android, cold, one step for the whole build
        working-directory: apps/mobile
        timeout-minutes: 140
        run: |
          & ../../.github/iris-guide/run-build-step.ps1 -Step 'old-run-android' -Run 'cold' -CommandFile "$env:RUNNER_TEMP\r5\old-run-android-no-phone.ps1" -WorkDir (Get-Location).Path -Deadline 7200 -NoCi
          $code = $LASTEXITCODE
          $r = Get-Content "$env:RUNNER_TEMP\r5\results.jsonl" | ForEach-Object { $_ | ConvertFrom-Json } | Select-Object -Last 1
          $iris = if ($r.closeAt -gt 900) { "MORE than Iris's 900 s: Iris stops the step and records timed_out" } else { "within Iris's 900 s" }
          $line = "old one step: 'close' at $($r.closeAt) s, BUILD line at $($r.buildLineAt) s, CMake ABIs [$($r.abis)], $iris"
          Write-Output $line
          $line >> $env:GITHUB_STEP_SUMMARY
          if ($code -ne 0) { Write-Error "the old build did not end with exit 0 (Iris $code)"; exit 1 }

      - name: the APK and the ABIs inside it
        if: always()
        working-directory: apps/mobile/android
        run: |
          $apk = Get-ChildItem app/build/outputs/apk/release -Filter *.apk -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $apk) { Write-Output 'no release APK'; exit 0 }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($apk.FullName)
          $abis = @($zip.Entries | Where-Object { $_.FullName -match '^lib/([^/]+)/' } | ForEach-Object { $Matches[1] } | Sort-Object -Unique)
          $zip.Dispose()
          $text = "$($apk.Name): $([math]::Round($apk.Length / 1MB, 1)) MB, native code for: $($abis -join ', ')"
          Write-Output $text
          "APK: $text" >> $env:GITHUB_STEP_SUMMARY
          Set-Content (Join-Path $env:RUNNER_TEMP 'r5\apk-abis.txt') ($abis -join ',')

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-android-old-one-step-logs
          path: ${{ runner.temp }}/r5/

  # ---- Blind verify r6 (not part of the fix): the whole Windows guide through
  # Iris for Windows 0.9.15's own code (recipeFromGuide + PowerShellSession,
  # vendored verbatim in .github/verify-r6/iris), detached, registry
  # environment, fresh SDK, no Java, Node LTS; then every step again.
  blind-r6-full-guide-iris-0915:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 200
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: make this runner a fresh reader PC
        run: ./.github/verify-r6/fresh-pc.ps1
      - name: cold - every Windows guide command through Iris 0.9.15's code
        timeout-minutes: 170
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'blind'
          $env:STANDIN = 'node "' + (Join-Path $env:GITHUB_WORKSPACE '.github\iris-guide\expo-build-no-phone.mjs') + '"'
          $steps = 'check-tools', 'clone', 'enter-folder', 'pin-source', 'dependencies', 'build-corpus', 'install-jdk', 'prebuild-android', 'prepare-gradle', 'build-native-1', 'build-native-2', 'build-native-app', 'build-libraries', 'prepare-app', 'run-android', 'run-android@standin'
          node .github/verify-r6/launch-like-electron.mjs (Join-Path $dir 'env.json') (Get-Command node).Source $env:TSX_CLI .github/verify-r6/iris-drive.mts .github/verify-r6/nut-ai-guide-v16.json (Join-Path $dir 'results.jsonl') cold @steps
          Write-Output "driver exit $LASTEXITCODE"
      - name: again - every step a second time
        timeout-minutes: 120
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'blind'
          $env:STANDIN = 'node "' + (Join-Path $env:GITHUB_WORKSPACE '.github\iris-guide\expo-build-no-phone.mjs') + '"'
          $steps = 'check-tools', 'clone', 'enter-folder', 'pin-source', 'dependencies', 'build-corpus', 'install-jdk', 'prebuild-android', 'prepare-gradle', 'build-native-1', 'build-native-2', 'build-native-app', 'build-libraries', 'prepare-app', 'run-android', 'run-android@standin'
          node .github/verify-r6/launch-like-electron.mjs (Join-Path $dir 'env.json') (Get-Command node).Source $env:TSX_CLI .github/verify-r6/iris-drive.mts .github/verify-r6/nut-ai-guide-v16.json (Join-Path $dir 'results.jsonl') again @steps
          Write-Output "driver exit $LASTEXITCODE"
      - name: verdict
        if: always()
        run: |
          node .github/verify-r6/verdict.mjs (Join-Path $env:RUNNER_TEMP 'blind\results.jsonl')
          $code = $LASTEXITCODE
          $apk = Get-ChildItem "$HOME\nut-ai\apps\mobile\android\app\build\outputs\apk\release" -Filter *.apk -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($apk) {
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $zip = [System.IO.Compression.ZipFile]::OpenRead($apk.FullName)
            $abis = @($zip.Entries | Where-Object { $_.FullName -match '^lib/([^/]+)/' } | ForEach-Object { $Matches[1] } | Sort-Object -Unique)
            $zip.Dispose()
            "APK: $($apk.Name) $([math]::Round($apk.Length / 1MB, 1)) MB, native code for: $($abis -join ', ')" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
          } else { 'no release APK' | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY }
          Get-ChildItem "$env:LOCALAPPDATA\Android\Sdk" -ErrorAction SilentlyContinue | ForEach-Object { "SDK after the build has: $($_.Name)" }
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blind-r6-full-guide-iris-0915
          path: ${{ runner.temp }}/blind/results.jsonl

  # Blind verify r6: the dependencies step on an unsupported Node, through Iris's code.
  blind-r6-node-gate-iris-0915:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22.15.0', '23']
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: make this runner a fresh reader PC
        run: ./.github/verify-r6/fresh-pc.ps1
      - name: guide steps up to dependencies through Iris 0.9.15's code
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'blind'
          node .github/verify-r6/launch-like-electron.mjs (Join-Path $dir 'env.json') (Get-Command node).Source $env:TSX_CLI .github/verify-r6/iris-drive.mts .github/verify-r6/nut-ai-guide-v16.json (Join-Path $dir 'results.jsonl') node-${{ matrix.node }} check-tools clone enter-folder pin-source dependencies
          node .github/verify-r6/verdict-node-gate.mjs (Join-Path $dir 'results.jsonl') "$HOME\nut-ai\node_modules"

  # Blind verify r6: a reader whose own JAVA_HOME is a NEWER JDK (install-jdk accepts any 17+).
  blind-r6-newer-java-iris-0915:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        java: ['25', '26']
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - id: jdk
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: make this runner a fresh reader PC with JAVA_HOME = JDK ${{ matrix.java }}
        run: |
          $env:NEWJAVA = '${{ steps.jdk.outputs.path }}'
          ./.github/verify-r6/fresh-pc.ps1
      - name: guide steps through build-native-1 via Iris 0.9.15's code
        timeout-minutes: 75
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'blind'
          node .github/verify-r6/launch-like-electron.mjs (Join-Path $dir 'env.json') (Get-Command node).Source $env:TSX_CLI .github/verify-r6/iris-drive.mts .github/verify-r6/nut-ai-guide-v16.json (Join-Path $dir 'results.jsonl') java-${{ matrix.java }} check-tools clone enter-folder pin-source dependencies build-corpus install-jdk prebuild-android prepare-gradle build-native-1
          node .github/verify-r6/verdict.mjs (Join-Path $dir 'results.jsonl')
