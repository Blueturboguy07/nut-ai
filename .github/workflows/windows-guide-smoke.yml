# Blind-verifier probe (not for main): how long is the first Android release
# build when only ONE ABI is built (what expo run:android does with a phone
# attached)? Iris on Windows stops a command after 15 minutes.
name: windows guide smoke

on:
  workflow_dispatch:

jobs:
  one-abi-build:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm install
        run: npm install *> npm-install.log; Write-Output "npm install exit $LASTEXITCODE"
      - name: prebuild
        working-directory: apps/mobile
        run: npx.cmd expo prebuild --platform android *> prebuild.log; Write-Output "prebuild exit $LASTEXITCODE"
      - name: first release build, arm64-v8a only
        working-directory: apps/mobile/android
        env:
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
        run: |
          $t0 = Get-Date
          .\gradlew.bat app:assembleRelease *> gradle.log
          $code = $LASTEXITCODE
          $min = [math]::Round(((Get-Date) - $t0).TotalMinutes, 1)
          Get-Content gradle.log -Tail 8
          Write-Output "FIRST BUILD gradle exit $code after $min min (arm64-v8a only)"
      - name: second release build (caches warm)
        working-directory: apps/mobile/android
        env:
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
        run: |
          $t0 = Get-Date
          .\gradlew.bat app:assembleRelease *> gradle2.log
          $code = $LASTEXITCODE
          $min = [math]::Round(((Get-Date) - $t0).TotalMinutes, 1)
          Write-Output "SECOND BUILD gradle exit $code after $min min"
