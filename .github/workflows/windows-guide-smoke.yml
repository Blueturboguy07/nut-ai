# Blind-verifier probe (not for main): the guide v16 "Install Java 17" step on
# a Windows PC that already has Java 8 on PATH, then the Android build.
name: windows guide smoke

on:
  workflow_dispatch:

jobs:
  java8:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm install
        run: npm install *> npm-install.log; Write-Output "npm install exit $LASTEXITCODE"
      - name: Generate the Android project (guide step prebuild-android)
        working-directory: apps/mobile
        run: npx.cmd expo prebuild --platform android *> prebuild.log; Write-Output "prebuild exit $LASTEXITCODE"; Get-Content prebuild.log -Tail 5
      - name: Guide step install-jdk, with Java 8 first on PATH and as JAVA_HOME
        run: |
          $j8 = $env:JAVA_HOME_8_X64
          Write-Output "JAVA_HOME_8_X64=$j8"
          "JAVA_HOME=$j8" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$j8\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: The guide's exact Windows install-jdk command
        run: |
          Write-Output "java on PATH: $((Get-Command java).Source)"
          if (-not (Get-Command java -ErrorAction SilentlyContinue)) {
            winget install --id EclipseAdoptium.Temurin.17.JDK -e --accept-source-agreements --accept-package-agreements
            $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          }
          java -version
      - name: The Android release build Expo runs (gradlew app:assembleRelease)
        working-directory: apps/mobile/android
        run: |
          .\gradlew.bat app:assembleRelease --no-daemon *> gradle.log
          $code = $LASTEXITCODE
          Get-Content gradle.log -Tail 25
          Write-Output "gradle exit $code with JAVA_HOME=$env:JAVA_HOME"
          exit 0
