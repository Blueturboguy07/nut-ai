# The commands the publik Iris guide runs on a Windows PC before the phone
# build, on a clean runner, with no Visual Studio needed.
#
# Nov 1 2026: better-sqlite3 made `npm install` run node-gyp on every fresh
# install (npm's rebuild set ignores the package's own "gypfile": false when
# the entry comes from the lockfile), so a PC without the C++ build tools
# died at "Could not find any Visual Studio installation to use" and the
# corpus build and the phone build fell over after it. The driver is now
# node:sqlite, so an install that still prints "gyp" is a regression.
name: windows guide smoke

on:
  workflow_dispatch:
  push:
    branches: [main, 'fix/**']
    paths:
      - package.json
      - package-lock.json
      - tools/**
      - packages/db-adapter/**
      - scripts/check-node-sqlite.mjs
      - scripts/check-node-version.cjs
      - .github/iris-guide/**
      - .github/workflows/windows-guide-smoke.yml
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - tools/**
      - packages/db-adapter/**
      - scripts/check-node-sqlite.mjs
      - scripts/check-node-version.cjs
      - .github/iris-guide/**
      - .github/workflows/windows-guide-smoke.yml

jobs:
  # 22.16.0 is the floor (the first 22.x whose node:sqlite has FTS5), '22' is
  # the current LTS line, '24' the next one.
  install-and-build-corpus:
    name: install-and-build-corpus (Node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22.16.0', '22', '24']
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Exactly the guide's step. The output is kept so the next step can
      # prove no native build ran: this runner HAS Visual Studio, so a
      # node-gyp rebuild would quietly succeed here and only fail on a
      # reader's PC.
      - name: npm install (the guide's "Install dependencies" step)
        run: |
          node --version
          npm install 2>&1 | Tee-Object -FilePath npm-install.log

      - name: no native build ran
        run: |
          if (Select-String -Path npm-install.log -Pattern 'gyp' -Quiet) {
            Write-Error 'npm install ran node-gyp; a PC without Visual Studio fails here'
            exit 1
          }
          if (Test-Path node_modules/better-sqlite3) {
            Write-Error 'better-sqlite3 is back in node_modules'
            exit 1
          }
          node scripts/check-node-sqlite.mjs

      - name: npm run data:build (the guide's "Build the nutrition database" step)
        run: npm run data:build 2>&1 | Tee-Object -FilePath data-build.log

      - name: the guide's visual check
        run: |
          if (-not (Select-String -Path data-build.log -Pattern '^Built ' -Quiet)) {
            Write-Error "data:build did not print 'Built .../nutrition.db'"
            exit 1
          }
          if (-not (Select-String -Path data-build.log -Pattern 'foods:\s+\d{4,}' -Quiet)) {
            Write-Error 'data:build did not print a foods count'
            exit 1
          }

      - name: npm run data:verify
        run: npm run data:verify

      - name: db-adapter and resolver tests on node:sqlite
        run: npx vitest run packages/db-adapter packages/resolver

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-guide-smoke-logs-node-${{ matrix.node }}
          path: |
            npm-install.log
            data-build.log

  # The guide's first check sees THAT Node answers, not which version. On
  # Node 20 the install used to pass with an engines warning and the corpus
  # build then died on "No such built-in module: node:sqlite"; on Node
  # 22.13-22.15 and 23.x it passed and the corpus build died on "no such
  # module: fts5" (blind verify, Nov 1 2026). The root preinstall
  # (scripts/check-node-version.cjs) must stop the install itself, and say why.
  unsupported-node-is-stopped:
    name: unsupported-node-is-stopped (Node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22.13.0', '22.15.0', '23.11.0']
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: npm install on Node ${{ matrix.node }} stops and names the Node floor
        run: |
          node --version
          npm install *> npm-install-unsupported.log
          $code = $LASTEXITCODE
          Get-Content npm-install-unsupported.log -Tail 15
          if ($code -eq 0) {
            Write-Error "npm install passed on Node ${{ matrix.node }}; the corpus build would die on node:sqlite or fts5 later"
            exit 1
          }
          if (-not (Select-String -Path npm-install-unsupported.log -Pattern 'Nut AI needs Node 22.16.0 or newer, and not Node 23.' -SimpleMatch -Quiet)) {
            Write-Error "npm install failed on Node ${{ matrix.node }} (exit $code) without naming the Node floor"
            exit 1
          }
          Write-Output "stopped as intended (exit $code)"
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unsupported-node-install-log-${{ matrix.node }}
          path: npm-install-unsupported.log

  # The guide's install-jdk step (Windows) on a PC whose java is Java 8: Java
  # 8 first on the machine PATH and JAVA_HOME pointing at it. Guide v16 first
  # only asked whether a java command existed, so it skipped the install and
  # Gradle then stopped with "Gradle requires JVM 17 or later to run" (blind
  # verify, run 41385115883). Every command runs through run-like-iris.mjs:
  # a fresh Windows PowerShell per step, PATH from the registry, done on the
  # pipe 'close', as in Iris.
  install-jdk-replaces-java-8:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: npm install and generate the Android project (the guide's earlier steps)
        run: |
          npm install --no-audit --no-fund 2>&1 | Select-Object -Last 5
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Set-Location apps/mobile
          npx expo prebuild --platform android 2>&1 | Select-Object -Last 5
          if (-not (Test-Path android/gradlew.bat)) { Write-Error 'no android/gradlew.bat'; exit 1 }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: make this runner a PC with Java 8 (machine PATH and JAVA_HOME)
        run: |
          $java8 = $env:JAVA_HOME
          & "$java8\bin\java.exe" -version
          $isJava = '(?i)\\java|jdk|jre|javapath|adoptium|zulu|corretto'
          foreach ($scope in 'Machine', 'User') {
            $entries = @(([Environment]::GetEnvironmentVariable('Path', $scope)) -split ';' | Where-Object { $_ })
            $removed = @($entries | Where-Object { $_ -match $isJava })
            $kept = @($entries | Where-Object { $_ -notmatch $isJava })
            Write-Output "$scope Path: removed $($removed.Count) Java entries: $($removed -join ' | ')"
            if ($scope -eq 'Machine') { $kept = @("$java8\bin") + $kept }
            [Environment]::SetEnvironmentVariable('Path', ($kept -join ';'), $scope)
          }
          [Environment]::SetEnvironmentVariable('JAVA_HOME', $java8, 'Machine')
          [Environment]::SetEnvironmentVariable('JAVA_HOME', $null, 'User')
          Get-ChildItem "$env:ProgramFiles\Eclipse Adoptium" -ErrorAction SilentlyContinue | ForEach-Object { "already under Program Files: $($_.FullName)" }
          Write-Output "JAVA_HOME for the next steps (what Iris would inherit): $java8"
          # An empty build: `help` there starts Gradle (this project's wrapper,
          # Gradle 9.3.1) in seconds and needs no Android SDK or Node.
          $empty = Join-Path $env:RUNNER_TEMP 'empty-build'
          New-Item -ItemType Directory -Force $empty | Out-Null
          Set-Content (Join-Path $empty 'settings.gradle') "rootProject.name = 'jvm-probe'"

      # Gradle 9 checks its JVM when it starts a build, not for --version.
      - name: control - Gradle on this PC before the guide step refuses Java 8
        working-directory: apps/mobile/android
        run: |
          $empty = Join-Path $env:RUNNER_TEMP 'empty-build'
          $probe = Join-Path $env:RUNNER_TEMP 'control.ps1'
          Set-Content $probe "java -version`n.\gradlew.bat --version`n.\gradlew.bat -p '$empty' help --console=plain"
          node ../../../.github/iris-guide/run-like-iris.mjs $probe (Get-Location).Path "$env:RUNNER_TEMP\control.log" 600
          $code = $LASTEXITCODE
          if ($code -eq 0) { Write-Error 'Gradle built on Java 8; this runner does not reproduce the reader PC'; exit 1 }
          if (-not (Select-String -Path "$env:RUNNER_TEMP\control.log" -Pattern 'Gradle requires JVM 17 or later to run' -SimpleMatch -Quiet)) {
            Write-Error "Gradle failed on Java 8 (exit $code) without the JVM 17 message"
            exit 1
          }
          Write-Output "reproduced: Gradle refuses Java 8 (Iris exit $code)"
          exit 0

      - name: the guide's install-jdk command (verbatim), as Iris runs it
        run: |
          node .github/iris-guide/run-like-iris.mjs .github/iris-guide/install-jdk.ps1 $HOME install-jdk.log 900
          $code = $LASTEXITCODE
          if ($code -ne 0) { Write-Error "install-jdk failed (Iris exit $code)"; exit 1 }
          $last = Select-String -Path install-jdk.log -Pattern 'version "(1\.)?(\d+)' | Select-Object -Last 1
          if (-not $last) { Write-Error 'install-jdk printed no java version'; exit 1 }
          # "1.8.0_504" -> 8, "17.0.20" -> 17: group 2 is the major either way.
          $major = [int]$last.Matches[0].Groups[2].Value
          Write-Output "last java -version line: $($last.Line.Trim()) -> major $major"
          if ($major -lt 17) { Write-Error "install-jdk ended on Java $major"; exit 1 }
          $saved = [Environment]::GetEnvironmentVariable('JAVA_HOME', 'User')
          Write-Output "User JAVA_HOME saved by the step: $saved"
          if (-not $saved -or -not (Test-Path "$saved\bin\java.exe")) { Write-Error 'no usable User JAVA_HOME saved'; exit 1 }

      # The run-android prelude, verbatim, then the same Gradle probe as the
      # control instead of the 20-minute release build. --no-daemon: a daemon
      # outlives the step (see the next step).
      - name: the guide's run-android prelude, as Iris runs it - Gradle builds on 17
        working-directory: apps/mobile/android
        run: |
          $guide = Get-Content ../../../.github/iris-guide/run-android.ps1 -Raw
          $build = 'npx.cmd expo run:android --variant release'
          if (-not $guide.Contains($build)) { Write-Error 'run-android.ps1 no longer ends with the expo build'; exit 1 }
          $empty = Join-Path $env:RUNNER_TEMP 'empty-build'
          $probe = Join-Path $env:RUNNER_TEMP 'after.ps1'
          Set-Content $probe $guide.Replace($build, "java -version`n.\gradlew.bat --version`n.\gradlew.bat -p '$empty' help --no-daemon --console=plain")
          node ../../../.github/iris-guide/run-like-iris.mjs $probe (Get-Location).Path "$env:RUNNER_TEMP\gradle.log" 600
          $code = $LASTEXITCODE
          if ($code -ne 0) { Write-Error "Gradle failed after install-jdk (Iris exit $code)"; exit 1 }
          $jvm = Select-String -Path "$env:RUNNER_TEMP\gradle.log" -Pattern 'JVM:\s+(\d+)' | Select-Object -First 1
          if (-not $jvm) { Write-Error 'gradlew --version printed no JVM line'; exit 1 }
          Write-Output "Gradle: $($jvm.Line.Trim())"
          if ([int]$jvm.Matches[0].Groups[1].Value -lt 17) { Write-Error 'Gradle still runs on a JVM older than 17'; exit 1 }
          if (Select-String -Path "$env:RUNNER_TEMP\gradle.log" -Pattern 'Gradle requires JVM 17' -SimpleMatch -Quiet) { Write-Error 'Gradle still refuses the JVM'; exit 1 }
          if (-not (Select-String -Path "$env:RUNNER_TEMP\gradle.log" -Pattern 'BUILD SUCCESSFUL' -SimpleMatch -Quiet)) { Write-Error 'the Gradle build did not succeed'; exit 1 }
          Write-Output 'Gradle builds on Java 17 after the guide step'

      # Iris waits for the pipe 'close', and a Gradle daemon that starts inside
      # the step keeps the pipe open after the build is done (round 3 measured
      # it here: BUILD SUCCESSFUL in 6 s, no 'close' in 180 s, Iris would
      # record 124). The guide's run-android now turns the daemon off, so the
      # same build with its prelude must end on its own.
      - name: the guide's run-android prelude leaves no daemon - Iris gets the 'close'
        working-directory: apps/mobile/android
        timeout-minutes: 10
        run: |
          $guide = Get-Content ../../../.github/iris-guide/run-android.ps1 -Raw
          $empty = Join-Path $env:RUNNER_TEMP 'empty-build'
          $probe = Join-Path $env:RUNNER_TEMP 'daemon.ps1'
          Set-Content $probe $guide.Replace('npx.cmd expo run:android --variant release', ".\gradlew.bat -p '$empty' help --console=plain")
          node ../../../.github/iris-guide/run-like-iris.mjs $probe (Get-Location).Path "$env:RUNNER_TEMP\daemon.log" 180
          $code = $LASTEXITCODE
          $built = Select-String -Path "$env:RUNNER_TEMP\daemon.log" -Pattern 'BUILD SUCCESSFUL' -SimpleMatch -Quiet
          & ../../../.github/iris-guide/build-processes.ps1 -Label 'after the prelude build' -FailOnDaemon -Stop
          $left = $LASTEXITCODE
          Write-Output "with the guide's prelude: build finished = $built, Iris exit $code (124 = Iris would time out)"
          if (-not $built) { Write-Error 'the Gradle build did not succeed'; exit 1 }
          if ($code -ne 0) { Write-Error "Iris would record $code"; exit 1 }
          if ($left -ne 0) { Write-Error 'a daemon outlived the step'; exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-jdk-java-8-logs
          path: |
            install-jdk.log
            ${{ runner.temp }}/control.log
            ${{ runner.temp }}/gradle.log
            ${{ runner.temp }}/daemon.log

  # The same command on a PC that already has Java 17 on PATH: nothing is
  # installed and no JAVA_HOME is saved.
  install-jdk-keeps-java-17:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: the guide's install-jdk command (verbatim), as Iris runs it
        run: |
          [Environment]::SetEnvironmentVariable('JAVA_HOME', $null, 'User')
          node .github/iris-guide/run-like-iris.mjs .github/iris-guide/install-jdk.ps1 $HOME install-jdk.log 900
          if ($LASTEXITCODE -ne 0) { Write-Error "install-jdk failed (Iris exit $LASTEXITCODE)"; exit 1 }
          if (-not (Select-String -Path install-jdk.log -Pattern 'version "17\.' -Quiet)) { Write-Error 'no Java 17 version line'; exit 1 }
          if (Select-String -Path install-jdk.log -Pattern 'Found Eclipse Temurin|Successfully installed' -Quiet) { Write-Error 'winget ran on a PC that already had Java 17'; exit 1 }
          $saved = [Environment]::GetEnvironmentVariable('JAVA_HOME', 'User')
          if ($saved) { Write-Error "a User JAVA_HOME was saved ($saved) although Java 17 was already there"; exit 1 }
          Write-Output 'Java 17 left alone: no winget, no saved JAVA_HOME'

  # Round 4 (Nov 1 2026). Iris for Windows ends a step on the pipe 'close'
  # (every copy of the child's output pipe closed), not on the process exit.
  # A Gradle daemon - and maybe a Kotlin compile daemon - that the build
  # starts inherits that pipe and outlives the step, so Iris recorded a good
  # run-android as timed out after 15 minutes. The guide's run-android now
  # turns both daemons off. This job runs the real Nut AI release build the
  # way that step starts it, through run-like-iris.mjs, with and without the
  # new lines. No phone or emulator here, so Gradle runs with the arguments
  # expo run:android --variant release passes it for an arm64 phone
  # (@expo/cli start/platforms/android/gradle.js assembleAsync). Expo also
  # sets __EXPO_EAGER_BUNDLE_OPTIONS after bundling itself; without it the
  # Gradle bundle task bundles. Manual only: a cold release build is long.
  run-android-gradle-daemons:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      EXPO_GRADLE: '.\gradlew.bat app:assembleRelease -x lint -x test --configure-on-demand -PreactNativeDevServerPort=8081 -PreactNativeArchitectures=arm64-v8a'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: npm install and generate the Android project (the guide's earlier steps)
        run: |
          npm install --no-audit --no-fund 2>&1 | Select-Object -Last 5
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Set-Location apps/mobile
          npx expo prebuild --platform android 2>&1 | Select-Object -Last 5
          if (-not (Test-Path android/gradlew.bat)) { Write-Error 'no android/gradlew.bat'; exit 1 }
          Get-Content android/gradle.properties | Where-Object { $_ -match '^(org\.gradle|kotlin)\.' }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Iris builds PATH from the registry, so the Node a reader installed is
      # the one in the machine Path. Put this job's Node 22 there.
      - name: make this runner a PC with Node 22 and Java 17, and write the commands
        run: |
          $nodeDir = Split-Path (Get-Command node).Source
          $machine = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          [Environment]::SetEnvironmentVariable('Path', "$nodeDir;$machine", 'Machine')
          [Environment]::SetEnvironmentVariable('JAVA_HOME', $null, 'User')
          Write-Output "node: $nodeDir ($(node --version)); JAVA_HOME: $env:JAVA_HOME; ANDROID_HOME: $env:ANDROID_HOME"
          Get-ChildItem (Join-Path $env:ANDROID_HOME 'ndk') -ErrorAction SilentlyContinue | ForEach-Object { "NDK on the runner: $($_.Name)" }
          $guide = Get-Content .github/iris-guide/run-android.ps1 -Raw
          $expo = 'npx.cmd expo run:android --variant release'
          if (-not $guide.Contains($expo)) { Write-Error 'run-android.ps1 no longer runs the expo build'; exit 1 }
          $lines = @($guide -split '\r?\n' | Where-Object { $_ -ne '' })
          $gradleOff = "`$env:GRADLE_OPTS = '-Dorg.gradle.daemon=false'"
          $kotlinOff = "`${env:ORG_GRADLE_PROJECT_kotlin.compiler.execution.strategy} = 'in-process'"
          if (-not ($lines -contains $gradleOff) -or -not ($lines -contains $kotlinOff)) { Write-Error 'run-android.ps1 lacks the daemon lines'; exit 1 }
          $dir = Join-Path $env:RUNNER_TEMP 'r4'
          New-Item -ItemType Directory -Force $dir | Out-Null
          # after: the guide's command, the expo line swapped for the Gradle build it starts.
          Set-Content "$dir\after.ps1" (($lines -join "`n").Replace($expo, $env:EXPO_GRADLE))
          # before: the round 3 command (the same lines without the two new ones).
          Set-Content "$dir\before.ps1" ((@($lines | Where-Object { $_ -ne $gradleOff -and $_ -ne $kotlinOff }) -join "`n").Replace($expo, $env:EXPO_GRADLE))
          # kotlin-daemon-on: the Gradle daemon off, the Kotlin compile daemon left on.
          Set-Content "$dir\kotlin-daemon-on.ps1" ((@($lines | Where-Object { $_ -ne $kotlinOff }) -join "`n").Replace($expo, $env:EXPO_GRADLE))
          foreach ($name in 'after', 'before', 'kotlin-daemon-on') { "== $name.ps1"; Get-Content "$dir\$name.ps1" }
          "| phase | daemons | deadline (s) | Iris records | BUILD line at (s) | ended at (s) | Gradle says |" >> $env:GITHUB_STEP_SUMMARY
          "|---|---|---|---|---|---|---|" >> $env:GITHUB_STEP_SUMMARY

      # D: the guide's exact command on a PC with no phone plugged in. Expo
      # looks for a device (adb) before it starts Gradle, and must stop with
      # its message, not hang on an adb server that holds the pipe.
      - name: D - the guide's exact run-android command, no phone connected
        working-directory: apps/mobile
        timeout-minutes: 10
        run: |
          $log = "$env:RUNNER_TEMP\r4\d-no-phone.log"
          node ../../.github/iris-guide/run-like-iris.mjs ../../.github/iris-guide/run-android.ps1 (Get-Location).Path $log 300
          $code = $LASTEXITCODE
          & ../../.github/iris-guide/build-processes.ps1 -Label 'after D' -Stop
          $t = Get-Content "$log.timing.json" | ConvertFrom-Json
          $said = (Select-String -Path $log -Pattern 'No Android connected device found' -SimpleMatch | Select-Object -First 1).Line
          "| D: exact guide command, no phone | off | 300 | $code | - | $($t.endedAt) | $said |" >> $env:GITHUB_STEP_SUMMARY
          if ($code -eq 124) { Write-Error 'the guide command with no phone never ended: a child holds the pipe'; exit 1 }
          if ($code -eq 0) { Write-Error 'expo run:android passed with no phone'; exit 1 }
          if (-not $said) { Write-Error "expo stopped (exit $code) without the no-device message"; exit 1 }
          Write-Output "no phone: expo stopped with exit $code at $($t.endedAt) s: $said"

      # A: "after", cold. The first build on a fresh PC downloads and compiles
      # everything; its time is reported against Iris's 900 s, not hidden.
      - name: A - after, cold build - the guide's run-android lines, daemons off
        working-directory: apps/mobile/android
        timeout-minutes: 75
        run: |
          $log = "$env:RUNNER_TEMP\r4\a-after-cold.log"
          node ../../../.github/iris-guide/run-like-iris.mjs "$env:RUNNER_TEMP\r4\after.ps1" (Get-Location).Path $log 3600
          $code = $LASTEXITCODE
          & ../../../.github/iris-guide/build-processes.ps1 -Label 'after A' -FailOnDaemon -Stop
          $left = $LASTEXITCODE
          $t = Get-Content "$log.timing.json" | ConvertFrom-Json
          $said = (Select-String -Path $log -Pattern 'BUILD (SUCCESSFUL|FAILED) in' | Select-Object -Last 1).Line
          "| A: after, cold | off | 3600 | $code | $($t.buildLineAt) | $($t.endedAt) | $said |" >> $env:GITHUB_STEP_SUMMARY
          Select-String -Path $log -Pattern 'single-use Daemon|Kotlin compiler execution strategy|in-process' | Select-Object -First 5 | ForEach-Object { $_.Line }
          if ($code -ne 0) { Write-Error "Iris would record $code"; exit 1 }
          if ($said -notmatch 'BUILD SUCCESSFUL') { Write-Error 'no BUILD SUCCESSFUL'; exit 1 }
          if ($left -ne 0) { Write-Error 'a daemon outlived the step'; exit 1 }
          $over = if ([double]$t.endedAt -gt 900) { 'MORE than' } else { 'within' }
          Write-Output "cold build: ended with exit 0 at $($t.endedAt) s, $over Iris's 900 s"

      # B: the Gradle daemon off but the Kotlin compile daemon on, after a
      # Kotlin change so the Kotlin compiler runs. Information: does the
      # Kotlin daemon alone hold the pipe?
      - name: B - info - Gradle daemon off, Kotlin compile daemon on
        working-directory: apps/mobile/android
        timeout-minutes: 20
        continue-on-error: true
        run: |
          $kt = Get-ChildItem app/src/main/java -Recurse -Filter MainApplication.kt | Select-Object -First 1
          Add-Content $kt.FullName '// windows-guide-smoke phase B'
          $log = "$env:RUNNER_TEMP\r4\b-kotlin-daemon-on.log"
          node ../../../.github/iris-guide/run-like-iris.mjs "$env:RUNNER_TEMP\r4\kotlin-daemon-on.ps1" (Get-Location).Path $log 900
          $code = $LASTEXITCODE
          & ../../../.github/iris-guide/build-processes.ps1 -Label 'after B' -Stop
          $t = Get-Content "$log.timing.json" | ConvertFrom-Json
          $said = (Select-String -Path $log -Pattern 'BUILD (SUCCESSFUL|FAILED) in' | Select-Object -Last 1).Line
          "| B: Kotlin daemon only | Gradle off, Kotlin on | 900 | $code | $($t.buildLineAt) | $($t.endedAt) | $said |" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "Kotlin daemon on: Iris exit $code (124 = Iris would time out), BUILD line at $($t.buildLineAt) s"

      # C: "before" - the round 3 command (daemons on), after a Kotlin change.
      # The bug: the build succeeds, then the step never ends and Iris
      # records a timeout at 900 s. This step passes only if that happens.
      - name: C - before - the round 3 run-android lines, daemons on
        working-directory: apps/mobile/android
        timeout-minutes: 25
        run: |
          $kt = Get-ChildItem app/src/main/java -Recurse -Filter MainApplication.kt | Select-Object -First 1
          Add-Content $kt.FullName '// windows-guide-smoke phase C'
          $log = "$env:RUNNER_TEMP\r4\c-before.log"
          node ../../../.github/iris-guide/run-like-iris.mjs "$env:RUNNER_TEMP\r4\before.ps1" (Get-Location).Path $log 900
          $code = $LASTEXITCODE
          & ../../../.github/iris-guide/build-processes.ps1 -Label 'after C'
          .\gradlew.bat --stop 2>&1 | Out-Host
          & ../../../.github/iris-guide/build-processes.ps1 -Label 'after gradlew --stop' -Stop
          $t = Get-Content "$log.timing.json" | ConvertFrom-Json
          $said = (Select-String -Path $log -Pattern 'BUILD (SUCCESSFUL|FAILED) in' | Select-Object -Last 1).Line
          "| C: before (round 3 command) | on | 900 | $code | $($t.buildLineAt) | $($t.endedAt) | $said |" >> $env:GITHUB_STEP_SUMMARY
          if ($said -notmatch 'BUILD SUCCESSFUL') { Write-Error 'the before build did not succeed, so it proves nothing'; exit 1 }
          if ($code -ne 124) { Write-Error "before: Iris would record $code, the daemon bug did not reproduce"; exit 1 }
          Write-Output "reproduced: BUILD SUCCESSFUL at $($t.buildLineAt) s, then no 'close' until the 900 s deadline (Iris 124)"

      # E: "after", warm, after a Kotlin change - the case a reader hits when
      # the step runs again. Must end with exit 0 well within 900 s.
      - name: E - after, warm build - the guide's run-android lines, daemons off
        working-directory: apps/mobile/android
        timeout-minutes: 20
        run: |
          $kt = Get-ChildItem app/src/main/java -Recurse -Filter MainApplication.kt | Select-Object -First 1
          Add-Content $kt.FullName '// windows-guide-smoke phase E'
          $log = "$env:RUNNER_TEMP\r4\e-after-warm.log"
          node ../../../.github/iris-guide/run-like-iris.mjs "$env:RUNNER_TEMP\r4\after.ps1" (Get-Location).Path $log 900
          $code = $LASTEXITCODE
          & ../../../.github/iris-guide/build-processes.ps1 -Label 'after E' -FailOnDaemon -Stop
          $left = $LASTEXITCODE
          $t = Get-Content "$log.timing.json" | ConvertFrom-Json
          $said = (Select-String -Path $log -Pattern 'BUILD (SUCCESSFUL|FAILED) in' | Select-Object -Last 1).Line
          "| E: after, warm | off | 900 | $code | $($t.buildLineAt) | $($t.endedAt) | $said |" >> $env:GITHUB_STEP_SUMMARY
          if ($code -ne 0) { Write-Error "Iris would record $code"; exit 1 }
          if ($said -notmatch 'BUILD SUCCESSFUL') { Write-Error 'no BUILD SUCCESSFUL'; exit 1 }
          if ($left -ne 0) { Write-Error 'a daemon outlived the step'; exit 1 }
          Write-Output "after: BUILD SUCCESSFUL at $($t.buildLineAt) s, 'close' at $($t.endedAt) s, Iris exit 0"

      - name: the build made an APK
        if: always()
        working-directory: apps/mobile/android
        run: Get-ChildItem app/build/outputs/apk -Recurse -Filter *.apk -ErrorAction SilentlyContinue | ForEach-Object { "$($_.FullName) $([math]::Round($_.Length / 1MB, 1)) MB" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-android-gradle-daemon-logs
          path: ${{ runner.temp }}/r4/
